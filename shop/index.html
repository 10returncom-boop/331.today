  function read(key, fallback) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function write(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }
  function money(n) { return "NT$" + Number(n || 0).toLocaleString("zh-TW"); }

  function priceLabel(n) { return Number(n) > 0 ? money(n) : "詢價"; }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function today() {
    var d = new Date();

  }
  function newOrderNo() {
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", s = "";

        qty: l.qty,
        name: hit.product.name,
        brand: hit.product.brand || "",

      if (c && subtotal >= (c.minSubtotal || 0)) {
        if (c.type === "fixed") discount = c.value;
        else if (c.type === "percent") discount = Math.min(Math.round(subtotal * c.value), c.maxDiscount || Infinity);
        else if (c.type === "shipping") freeShip = true;
      } else { c = null; }
    }
    if (discount > subtotal) discount = subtotal;

    var method = S.shipping.methods.filter(function (m) { return m.id === shipMethod; })[0] || S.shipping.methods[0];
    // 整車都是詢價品（單價 0）→ 不計運費、不計稅，金額一律「待報價」
    if (lines.length && subtotal === 0) {
      return {
        subtotal: 0, discount: 0, shipping: 0, tax: 0, total: 0,
        shipMethod: method.id, method: method, couponApplied: "", freeShip: false, inquiry: true,
        digital: allDigital(lines)
      };
    }
    var shipping = 0;
    if (lines.length) {
      var basis = subtotal; // goodsSubtotalBeforeDiscount
      if (allDigital(lines)) {
        shipping = 0; // 線上課程／數位內容：不寄送、不計運費、無偏遠加價
      } else {
        shipping = freeShip ? 0 : (basis >= method.freeOver ? 0 : method.fee);
        var zone = county && district ? county + "-" + district : county;
        var isRemote = S.shipping.remoteZones.some(function (z) {
          return z === county || z === zone;
        });
        if (isRemote && method.id === "home_delivery") shipping += S.shipping.remoteSurcharge;
      }
    }

    var taxable = subtotal - discount + shipping;
    var tax = Math.round(taxable * S.tax.rate);
    return {
      subtotal: subtotal, discount: discount, shipping: shipping, tax: tax,
      total: taxable + tax, shipMethod: method.id, method: method,
      couponApplied: c ? c.code : "", freeShip: freeShip,
      digital: allDigital(lines)
    };
  }

  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("on"); }, 2200);
  }

  function confirmDialog(title, body, okLabel) {
    return new Promise(function (resolve) {
      var ov = document.getElementById("overlay");
      document.getElementById("dlgTitle").textContent = title;
      document.getElementById("dlgBody").textContent = body;
      document.getElementById("dlgYes").textContent = okLabel || "確定";
      ov.classList.add("on");
      function done(v) {
        ov.classList.remove("on");
        document.getElementById("dlgYes").onclick = null;
        document.getElementById("dlgNo").onclick = null;
        resolve(v);
      }
      document.getElementById("dlgYes").onclick = function () { done(true); };
      document.getElementById("dlgNo").onclick = function () { done(false); };
    });
  }

  function addToCart(sku, qty) {
    var hit = idx[sku];
    if (!hit) { toast("找不到這個規格"); return; }
    var cap = Math.min(hit.variant.stock, S.cart.maxQtyPerLine);
    if (cap <= 0) { toast("此規格已售完"); return; }
    var line = cart.filter(function (l) { return l.sku === sku; })[0];
    var want = (line ? line.qty : 0) + (qty || 1);
    if (want > cap) {
      if (line) line.qty = cap;
      else cart.push({ sku: sku, qty: cap });
      saveCart();
      toast("已加到上限 " + cap + " 件（依庫存）");
      return;
    }
    if (line) line.qty = want;
    else cart.push({ sku: sku, qty: want });
    saveCart();
    toast("已加入購物車：" + hit.product.name + " ×" + (qty || 1));
  }

  function putOrder(o) {
    var list = orders();
    var hit = -1;
    for (var i = 0; i < list.length; i++) if (list[i].orderNo === o.orderNo) { hit = i; break; }

    else list.unshift(o);
    write(K_ORDERS, list.slice(0, 100));
  }

  function productCard(p) {
    var min = Math.min.apply(null, p.variants.map(function (v) { return v.price; }));
    var stock = p.variants.reduce(function (a, v) { return a + v.stock; }, 0);
    var digital = (p.shipping || {}).class === "digital";

    return '<article class="pcard">' +
      '<a href="#/product/' + p.slug + '" class="thumb">' + thumbHtml(p) + '</a>' +
      '<div class="body">' +
      '<a class="name" href="#/product/' + p.slug + '">' + esc(p.name) + "</a>" +
      '<div class="small muted">' + esc(p.summary).slice(0, 46) + "…</div>" +
      '<div class="price">' + (min > 0 ? money(min) + " 起" : (digital ? "報名詢價" : "詢價")) + "</div>" +
      "<div>" + tag + "</div>" +
      "</div></article>";

  function pagerHtml(page, total, base) {
    if (total <= PAGE_SIZE) return "";
    var pages = Math.ceil(total / PAGE_SIZE);
    var prev = page > 1
      ? '<a href="' + base + (page - 1 > 1 ? "/" + (page - 1) : "") + '">← 上一頁</a>'
      : '<span>← 上一頁</span>';
    var next = page < pages
      ? '<a href="' + base + "/" + (page + 1) + '">下一頁 →</a>'
      : '<span>下一頁 →</span>';
    return '<div class="pager">' + prev + '<span>' + page + " / " + pages + "（共 " + total + " 件）</span>" + next + "</div>";
  }

  function pageSlice(list, page) {
    var pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    var p = Math.min(Math.max(1, parseInt(page, 10) || 1), pages);
    return { items: list.slice((p - 1) * PAGE_SIZE, p * PAGE_SIZE), page: p };
  }

  function findCat(slug) {
    var out = null;
    CATS.forEach(function (c) {
      if (c.slug === slug) out = { parent: c, child: null, name: c.name, title: c.title || c.name, description: c.description };
      c.children.forEach(function (ch) {
        if (ch.slug === slug) out = { parent: c, child: ch, name: ch.name, title: ch.name, description: ch.description };
      });
    });
    return out;

  /* ---------- 超商取貨門市（三大超商動態下拉） ----------

  var STORES = (DB.stores && DB.stores.items) || [];
  var CVS_BRANDS = ["7-ELEVEN", "全家", "萊爾富"];

  function cvsBrandsAvailable() {
    if (!STORES.length) return CVS_BRANDS;
    var out = [];
    CVS_BRANDS.forEach(function (b) {
      if (STORES.some(function (s) { return s.brand === b; })) out.push(b);
    });
    return out.length ? out : CVS_BRANDS;
  }

  function storesIn(brand, county, district) {
    if (!county || !district) return [];
    return STORES.filter(function (s) {
      return s.brand === (brand || "7-ELEVEN") && s.county === county && s.district === district;
    });
  }

          '<div class="blocks" style="border-top:0">' +
          '<div class="blk"><b>聯絡方式</b><div>' + esc(f.name) + "・" + esc(f.phone) + "<br />" + esc(f.email) + (f.line ? "<br />LINE：" + esc(f.line) : "") + "</div></div>" +
          '<div class="blk"><b>開通流程</b><div>店主回覆課程費用與匯款方式 → 完成付款 → 開通線上觀看</div></div>' +

          '<button class="btn btn-ghost" type="button" id="stepBack2">上一步</button>' +
          '<button class="btn" type="button" id="stepNext2">下一步：確認</button></div>';

        }).join("") + "</div>" +
        (method.id === "cvs_pickup" ? cvsStorePickerHtml(f) : "") +

        (f.county ? ((ZIP.filter(function (c) { return c.name === f.county; })[0] || {}).districts || []).map(function (d) {
          return '<option value="' + esc(d.name) + '" data-zip="' + d.zip + '"' + (f.district === d.name ? " selected" : "") + ">" + esc(d.name) + "</option>";
        }).join("") : "") +
        '</select><div class="err" data-err="district">' + (state.errors.district || "") + "</div></div></div>" +

            '<div class="form-row"><label class="fl">地址 *</label><input id="f_address" value="' + esc(f.address) + '" data-field="address" placeholder="街道、巷弄、門牌" /><div class="err" data-err="address">' + (state.errors.address || "") + "</div></div>") +
        '<div class="pill-row" style="justify-content:space-between;margin-top:16px">' +

        '<button class="btn" type="button" id="stepNext2">下一步：確認</button></div>';

      (anyInquiry ? '<div class="note" style="margin-top:10px">⚠ 這是一張<b>詢價／預訂單</b>：只是把你的需求交給店主，<b>尚未成立交易、也不是發票開立憑證</b>。店主回覆報價、雙方確認成交與付款後，才會處理出貨或線上開通。</div>' : "") +
      '<div class="blocks" style="margin-top:12px">' +
      '<div class="blk"><b>收件人</b><div>' + esc(f.name) + "・" + esc(f.phone) + "<br />" + esc(f.email) + (f.line ? "<br />LINE：" + esc(f.line) : "") + "</div></div>" +
      '<div class="blk"><b>配送</b><div>' + (allDigital(cartLines())

  function validateStep(step) {
    var f = state.form, e = {};
    if (step === 1) {
      if (!f.name || f.name.length < 2) e.name = "請填寫姓名（至少 2 個字）";
      if (!/^09\d{8}$/.test(f.phone)) e.phone = "手機格式為 09xxxxxxxx";
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) e.email = "Email 格式不正確";
      // LINE ID 選填：不填不擋，只做長度上限
      if (f.line && String(f.line).trim().length > 60) e.line = "LINE ID 請在 60 個字以內";
    }
    if (step === 2) {
      if (allDigital(cartLines())) return true; // 線上開通：不需要地址與配送方式
      if (!f.county) e.county = "請選縣市";
      if (!f.district) e.district = "請選鄉鎮市區";
      if (f.shipMethod === "cvs_pickup") {
        if (!f.cvsBrand) e.cvsBrand = "請選取貨超商";
        if (!f.storeName) e.storeName = "請選取貨門市";
        if (!f.storeId) e.storeId = "請填門市代號";
      } else {
        if (!f.address || f.address.length < 4) e.address = "請填完整地址";
      }
    }
    state.errors = e;
    return Object.keys(e).length === 0;
  }

  function submitOrder() {
    var f = state.form;
    var lines = cartLines();
    var t = computeTotals(lines, coupon, f.shipMethod, f.county, f.district);
    var method = t.method;
    var order = {
      orderNo: newOrderNo(),
      createdAt: new Date().toLocaleString("zh-TW"),
      status: "pending",
      statusLabel: t.inquiry ? "待報價" : "待確認付款",
      inquiry: !!t.inquiry,
      items: lines.map(function (l) {
        return { sku: l.sku, name: l.name, optionLabel: l.optionLabel, qty: l.qty, price: l.price };
      }),
      totals: { subtotal: t.subtotal, discount: t.discount, shipping: t.shipping, tax: t.tax, total: t.total },
      coupon: coupon || "",
      receiver: { name: f.name, phone: f.phone, email: f.email, line: f.line || "" },
      shipMethod: t.digital ? "digital" : f.shipMethod,
      shipMethodName: t.digital ? "線上開通（不寄送）" : (f.shipMethod === "cvs_pickup" ? ("超商取貨（" + (f.cvsBrand || "7-ELEVEN") + "）") : method.name),
      shipEta: t.digital ? "報名後開通" : method.etaDays,
      cvsBrand: f.shipMethod === "cvs_pickup" ? (f.cvsBrand || "7-ELEVEN") : "",
      storeName: f.storeName,
      storeId: f.storeId,
      addressText: t.digital
        ? "線上開通（不寄送）"
        : (f.shipMethod === "cvs_pickup"
          ? ((f.cvsBrand || "7-ELEVEN") + " " + f.county + f.district + "｜" + f.storeName + "（" + f.storeId + "）")
          : (f.zip + " " + f.county + f.district + f.address)),
      invoiceType: "after_deal",
      invoiceText: INVOICE_NOTE,
      note: f.note
    };
    saveOrder(order);
    cart = [];
    coupon = null;
    saveCart();
    write(K_COUPON, null);
    state.step = 1;

    var mail = buildMail(order);

    // ① 送出即自動開一封預填信（在點擊同一個手勢內，較不會被瀏覽器攔）
    var opened = false;
    if (CONFIG.autoOpenMail) {
      try {
        var a = document.createElement("a");
        a.href = mailtoHref(mail);
        a.target = "_blank";
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        opened = true;
      } catch (e) { opened = false; }
    }

    // ② 有端點就順手送出（失敗不阻擋流程，頁面仍有複製／郵件兩條退路）
    var orderChannels = { google: false, api: false, emailed: false };
    if (ORDER_ENDPOINT) {
      fetch(ORDER_ENDPOINT, {
        method: "POST",
        headers: { "content-type": "application/json", accept: "application/json" },
        body: JSON.stringify({ to: mail.to, subject: mail.subject, body: mail.body, order: order })
      })
        .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
        .then(function (res) {
          if (res.ok && res.d && res.d.ok) {
            orderChannels.api = true;
            orderChannels.emailed = !!res.d.emailed;
            order.channels = orderChannels;
            putOrder(order);
            toast(res.d.emailed ? "訂單已自動寄給店家" : "店家端已收到訂單（寄信金鑰未設定，未實際寄出）");
            if (location.hash.indexOf(order.orderNo) >= 0) render();
          } else {
            toast("自動寄出失敗，請用下方「開啟郵件程式」或「複製訂單內容」");
          }
        })
        .catch(function () { toast("自動寄出失敗，請用下方「開啟郵件程式」或「複製訂單內容」"); });
    }

    // ③ 有設 Google 表單就同步寫入一份（店家由 Google 的通知信收到）
    var viaGoogle = submitGoogleForm(order);
    if (viaGoogle) {
      orderChannels.google = true;
      toast("已寫入 Google 表單，店家會收到通知");
    }

    order.channels = orderChannels;
    putOrder(order);

    location.hash = "#/order/" + order.orderNo + "?new=1" + (opened ? "&mail=1" : "");
  }

  // 把訂單塞進 Google 表單（隱藏 form + iframe，不會離開本站；Google 表單可設「回覆通知」寄給店家）
  function submitGoogleForm(o) {
    var gf = CONFIG.googleForm;
    if (!gf || !gf.action) return false;
    var frameName = "gf_sink_" + Date.now();
    var iframe = document.createElement("iframe");
    iframe.name = frameName;
    iframe.style.display = "none";
    document.body.appendChild(iframe);

    var form = document.createElement("form");
    form.method = "POST";
    form.action = gf.action;
    form.target = frameName;
    form.style.display = "none";
    form.setAttribute("accept-charset", "UTF-8");

    var data = {
      orderNo: o.orderNo,
      name: o.receiver.name,
      phone: o.receiver.phone,
      email: o.receiver.email,
      total: o.inquiry ? "待報價" : o.totals.total,
      items: o.items.map(function (it) { return it.name + "(" + it.optionLabel + ")x" + it.qty; }).join(" / "),
      address: o.addressText,
      ship: o.shipMethodName,
      invoice: o.invoiceText,
      note: (o.receiver.line ? "LINE：" + o.receiver.line + "\n" : "") + (o.note || "")
    };
    var entries = gf.entries || {};
    var filled = 0;
    Object.keys(data).forEach(function (k) {
      var entry = entries[k];
      if (!entry) return;
      var inp = document.createElement("input");
      inp.type = "hidden";
      inp.name = entry;
      inp.value = String(data[k]);
      form.appendChild(inp);
      filled++;
    });
    if (!filled) {
      iframe.remove();
      return false;
    }
    document.body.appendChild(form);
    form.submit();
    setTimeout(function () {
      form.remove();
      iframe.remove();
    }, 1500);
    return true;
  }

  /* ---------- 動態 robots：骨架站、購物車、結帳、查詢一律不索引 ---------- */
  function setRobots(content) {
    var m = document.head.querySelector('meta[name="robots"]');
    if (!m) {
      m = document.createElement("meta");
      m.setAttribute("name", "robots");
      document.head.appendChild(m);
    }
    m.setAttribute("content", content);
  }

  function applyRobots(parts) {
    var page = parts[0] || "";
    // 交易流程頁：不索引、不跟隨
    if (page === "cart" || page === "checkout" || page === "lookup" || page === "orders" || page === "order") {
      setRobots("noindex,nofollow");
      return;
    }
    // 分類頁：沒有商品（骨架站）、或分類標了 noindex → 不索引
    if (page === "category") {
      var slug = parts[1] || "";
      if (!slug) { setRobots("index,follow"); return; }
      var cat = findCat(slug);
      if (!cat) { setRobots("noindex,follow"); return; }
      var items = cat.child
        ? PRODUCTS.filter(function (p) { return p.category === slug; })
        : PRODUCTS.filter(function (p) {
          return cat.parent.children.some(function (ch) { return ch.slug === p.category; });
        });
      var flagged = (cat.child ? cat.child.noindex : cat.parent.noindex) ||
        (cat.parent && cat.parent.noindex);
      setRobots(items.length === 0 || flagged ? "noindex,follow" : "index,follow");
      return;
    }
    // 商品頁：草稿或標 noindex → 不索引；找不到 → 不索引
    if (page === "product") {
      var p = PRODUCTS.filter(function (x) { return x.slug === (parts[1] || ""); })[0];
      if (!p) { setRobots("noindex,follow"); return; }
      setRobots(p.status === "draft" || p.noindex ? "noindex,follow" : "index,follow");
      return;
    }
    if (page === "" ) { setRobots(PRODUCTS.some(function (p) { return p.status === "live" && !p.noindex; }) ? "index,follow" : "noindex,nofollow"); return; }
    setRobots("index,follow");
  }

  function render() {
    applySiteBrand();
    var app = document.getElementById("app");
    var hash = location.hash.replace(/^#/, "") || "/";
    var qs = "";
    if (hash.indexOf("?") >= 0) { qs = hash.slice(hash.indexOf("?")); hash = hash.slice(0, hash.indexOf("?")); }
    var parts = hash.split("/").filter(Boolean);
    var html = "";

    if (!parts.length) html = viewHome(1);
    else if (parts[0] === "p") html = viewHome(parts[1]);
    else if (parts[0] === "category") html = parts[1] ? viewCategory(parts[1], parts[2]) : viewCategories();
    else if (parts[0] === "product") html = viewProduct(parts[1] || "");
    else if (parts[0] === "cart") html = viewCart();
    else if (parts[0] === "checkout") html = viewCheckout();
    else if (parts[0] === "order") html = viewOrder(parts[1] || "", qs.indexOf("new=1") >= 0, qs.indexOf("mail=1") >= 0);
    else if (parts[0] === "lookup" || parts[0] === "orders") html = viewLookup();
    else if (parts[0] === "policy" && parts[1] === "returns") html = viewPolicyReturns();
    else if (parts[0] === "policy" && parts[1] === "shipping") html = viewPolicyShipping();
    else html = viewNotFound();

    app.innerHTML = html;
    applyRobots(parts);
    syncBadge();
    bindView(parts);
    window.scrollTo({ top: 0 });
  }

  function bindView(parts) {
    var page = parts[0] || "";

    if (page === "product") {
      var p = PRODUCTS.filter(function (x) { return x.slug === parts[1]; })[0];
      if (!p) return;
      var thumbs = document.getElementById("pdpThumbs");
      if (thumbs) thumbs.addEventListener("click", function (ev) {
        var img = ev.target.closest("img");
        if (!img) return;
        var main = document.getElementById("pdpMain");
        main.src = img.getAttribute("data-src");
        thumbs.querySelectorAll("img").forEach(function (x) { x.classList.remove("active"); });
        img.classList.add("active");
      });

      var info = document.getElementById("pdpInfo");
      function refreshInfo() {
        info.innerHTML = pdpInfoHtml(p);
        bindInfo();
      }
      function bindInfo() {
        info.querySelectorAll(".opts").forEach(function (row) {
          row.addEventListener("click", function (ev) {
            var btn = ev.target.closest(".opt");
            if (!btn || btn.disabled) return;
            state.product.sel[row.getAttribute("data-spec")] = btn.getAttribute("data-val");
            refreshInfo();
          });
        });
        var q = document.getElementById("qInput");
        var v = currentVariant(p, state.product.sel) || p.variants[0];
        var cap = Math.min(v.stock, S.cart.maxQtyPerLine);
        document.getElementById("qMinus").onclick = function () {
          state.product.qty = Math.max(1, state.product.qty - 1);
          q.value = state.product.qty;
        };
        document.getElementById("qPlus").onclick = function () {
          state.product.qty = Math.min(cap || 1, state.product.qty + 1);
          q.value = state.product.qty;
        };
        q.onchange = function () {
          var n = parseInt(q.value, 10) || 1;
          state.product.qty = Math.min(cap || 1, Math.max(1, n));
          q.value = state.product.qty;
        };
        var addBtn = document.getElementById("addToCart");
        if (addBtn) addBtn.onclick = function () {
          addToCart(v.sku, state.product.qty);
        };
        var buyBtn = document.getElementById("buyNow");
        if (buyBtn) buyBtn.onclick = function () {
          addToCart(v.sku, state.product.qty);
          location.hash = "#/cart";
        };
      }
      bindInfo();
    }

    if (page === "cart") {
      var table = document.querySelector("[data-sku]") ? document.querySelector("table") : null;
      if (table) table.addEventListener("click", function (ev) {
        var btn = ev.target.closest("[data-act]");
        if (!btn) return;
        var row = ev.target.closest("tr[data-sku]");
        var sku = row.getAttribute("data-sku");
        var line = cart.filter(function (l) { return l.sku === sku; })[0];
        if (!line) return;
        var act = btn.getAttribute("data-act");
        var cap = Math.min(idx[sku].variant.stock, S.cart.maxQtyPerLine);
        if (act === "plus") { line.qty = Math.min(cap, line.qty + 1); saveCart(); render(); return; }
        if (act === "minus") { line.qty = Math.max(1, line.qty - 1); saveCart(); render(); return; }
        if (act === "remove") {
          confirmDialog("移除商品", "要把「" + idx[sku].product.name + "」從購物車移除嗎？", "移除").then(function (ok) {
            if (!ok) return;
            cart = cart.filter(function (l) { return l.sku !== sku; });
            saveCart(); render(); toast("已移除 " + idx[sku].product.name);
          });
        }
      });
      var tableInput = document.querySelector("table");
      if (tableInput) tableInput.addEventListener("change", function (ev) {
        var input = ev.target.closest("[data-act='qty']");
        if (!input) return;
        var row = ev.target.closest("tr[data-sku]");
        var sku = row.getAttribute("data-sku");
        var line = cart.filter(function (l) { return l.sku === sku; })[0];
        var cap = Math.min(idx[sku].variant.stock, S.cart.maxQtyPerLine);
        var n = parseInt(input.value, 10) || 1;
        line.qty = Math.min(cap, Math.max(1, n));
        saveCart(); render();
      });
      var applyBtn = document.getElementById("couponApply");
      if (applyBtn) applyBtn.onclick = function () {
        var code = (document.getElementById("couponInput").value || "").trim().toUpperCase();
        var msg = document.getElementById("couponMsg");
        var subtotal = cartLines().reduce(function (a, l) { return a + l.price * l.qty; }, 0);
        var c = S.coupons.filter(function (x) { return x.code === code && x.active; })[0];
        if (!c || subtotal < (c.minSubtotal || 0)) {
          coupon = null; write(K_COUPON, null);
          msg.textContent = "此優惠碼目前不適用本筆訂單，請確認代碼或改用其他優惠";
          saveCart(); render();
          return;
        }
        coupon = code; write(K_COUPON, code);
        toast("優惠碼已套用");
        render();
      };
      var checkoutBtn = document.getElementById("toCheckout");
      if (checkoutBtn) checkoutBtn.onclick = function () { location.hash = "#/checkout"; };
    }

    if (page === "checkout") bindCheckout();
    if (page === "order") bindOrder(parts[1]);

    if (page === "lookup" || page === "orders") {
      var btn = document.getElementById("lkBtn");
      if (btn) btn.onclick = function () {
        var no = (document.getElementById("lkNo").value || "").trim().toUpperCase();
        var mail = (document.getElementById("lkEmail").value || "").trim().toLowerCase();
        var msg = document.getElementById("lkMsg");
        msg.textContent = "";
        if (!no) { msg.textContent = "請先填訂單編號"; return; }
        var local = getOrder(no);
        if (local && (!mail || String(local.receiver.email).toLowerCase() === mail)) {
          location.hash = "#/order/" + local.orderNo;
          return;
        }
        if (!LOOKUP_ENDPOINT) {
          msg.textContent = local ? "Email 與訂單不符" : "本機查無此訂單編號";
          return;
        }
        if (!mail) { msg.textContent = "跨裝置查詢要同時填下單時留的 Email"; return; }
        msg.textContent = "查詢中…";
        fetch(LOOKUP_ENDPOINT + "/" + encodeURIComponent(no) + "?email=" + encodeURIComponent(mail))
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (!res.ok || !res.d || !res.d.ok || !res.d.order) {
              msg.textContent = "查無此訂單，或 Email 與訂單不符";
              return;
            }
            putOrder(res.d.order);
            location.hash = "#/order/" + res.d.order.orderNo;
          })
          .catch(function () { msg.textContent = "查詢失敗，請確認網路後再試"; });
      };
    }

    var cartBtn = document.getElementById("cartBtn");
    if (cartBtn) cartBtn.onclick = function () { location.hash = "#/cart"; };
  }

  function bindCheckout() {
    document.querySelectorAll("[data-field]").forEach(function (el) {
      el.addEventListener("change", function () {
        state.form[el.getAttribute("data-field")] = el.value;
        if (el.id === "f_county") { state.form.district = ""; state.form.zip = ""; render(); }
        if (el.id === "f_district") {
          var op = el.options ? el.options[el.selectedIndex] : null;
          state.form.zip = op ? (op.getAttribute("data-zip") || "") : "";
          state.form.storeName = ""; state.form.storeId = "";
          render();
        }
        if (el.id === "f_cvsBrand") {
          state.form.cvsBrand = el.value;
          state.form.storeName = ""; state.form.storeId = "";
          render();
        }
        if (el.id === "f_storeName" && el.options) {
          var sop = el.options[el.selectedIndex];
          state.form.storeId = sop ? (sop.getAttribute("data-id") || "") : "";
          render();
        }
      });
    });
    var ship = document.getElementById("shipList");
    if (ship) ship.addEventListener("change", function (ev) {
      if (ev.target.name !== "ship") return;
      state.form.shipMethod = ev.target.value;
      render();
    });
    var n1 = document.getElementById("stepNext1");
    if (n1) n1.onclick = function () {
      if (!validateStep(1)) { render(); toast("請確認標示的欄位"); return; }
      state.step = 2; render();
    };
    var b2 = document.getElementById("stepBack2");
    if (b2) b2.onclick = function () { state.step = 1; render(); };
    var n2 = document.getElementById("stepNext2");
    if (n2) n2.onclick = function () {
      if (!validateStep(2)) { render(); toast("請確認標示的欄位"); return; }
      state.step = 3; render();
    };
    var b3 = document.getElementById("stepBack3");
    if (b3) b3.onclick = function () { state.step = 2; render(); };
    var sub = document.getElementById("submitOrder");
    if (sub) sub.onclick = function () {
      var t = computeTotals(cartLines(), coupon, state.form.shipMethod, state.form.county, state.form.district);
      var n = cart.reduce(function (a, l) { return a + l.qty; }, 0);
      confirmDialog(t.inquiry ? "確認送出詢價單" : "確認送出訂單", t.inquiry
        ? (t.digital
          ? "共 " + n + " 項課程，費用待店家報價（送出後不會扣款，也不需要寄送）。"
          : "共 " + n + " 件作品，金額待店家報價（送出後不會扣款）。")
        : "總金額 " + money(t.total) + "（含 5% 營業稅 " + money(t.tax) + "）。送出後會建立本機訂單並產生 Email 內容。", t.inquiry ? "確認詢價" : "確認送出").then(function (ok) {
        if (ok) submitOrder();
      });
    };
  }

  function bindOrder(no) {
    var o = getOrder(no || "");
    if (!o) return;
    var mail = buildMail(o);
    var copyBtn = document.getElementById("copyMail");
    if (copyBtn) copyBtn.onclick = function () {
      copyText("To: " + mail.to + "\nSubject: " + mail.subject + "\n\n" + mail.body);
    };
    var postBtn = document.getElementById("postMail");
    if (postBtn) postBtn.onclick = function () {
      fetch(ORDER_ENDPOINT, {
        method: "POST",
        headers: { "content-type": "application/json", accept: "application/json" },
        body: JSON.stringify({ to: mail.to, subject: mail.subject, body: mail.body, order: o })
      }).then(function (r) {
        toast(r.ok ? "訂單已送出" : "送出失敗，請改用複製或郵件程式");
      }).catch(function () { toast("送出失敗，請改用複製或郵件程式"); });
    };
    var paid = document.getElementById("markPaid");
    if (paid) paid.onclick = function () {
      o.status = "paid"; o.statusLabel = "已付款（待店家確認）";
      updateOrder(o); render(); toast("已標記為已付款");
    };
    var cancel = document.getElementById("cancelOrder");
    if (cancel) cancel.onclick = function () {
      confirmDialog("取消訂單", "取消後這筆本機紀錄會標記為已取消；已寄出的 Email 不會撤回。", "取消訂單").then(function (ok) {
        if (!ok) return;
        o.status = "cancelled"; o.statusLabel = "已取消";
        updateOrder(o); render(); toast("訂單已取消");
      });
    };
  }

  function updateOrder(o) {
    var list = orders();
    var i = list.findIndex ? list.findIndex(function (x) { return x.orderNo === o.orderNo; }) : -1;
    if (i < 0) {
      for (var k = 0; k < list.length; k++) if (list[k].orderNo === o.orderNo) i = k;
    }
    if (i >= 0) list[i] = o;
    write(K_ORDERS, list);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast("已複製，貼到郵件即可寄出"); })
        .catch(function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("已複製，貼到郵件即可寄出"); }
    catch (e) { toast("複製失敗，請手動選取內容"); }
    document.body.removeChild(ta);
  }

  /* ---------- 啟動 ---------- */
  document.getElementById("ftShop").textContent = SHOP_NAME + "・" + S.shop.address;
  document.getElementById("ftSupport").textContent = "客服 " + CONTACT.tel + "・" + S.shop.supportHours + "・訂單信箱 " + ORDER_EMAIL;
  var fabLine = document.getElementById("fabLine");
  if (fabLine) fabLine.href = CONTACT.line;
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
