<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="googlebot" content="noindex,nofollow,noimageindex">
<title>會員專區 · 三三藝 331.today</title>
<style>
:root{--ink:#2c2116;--ink-soft:#6b5a44;--accent:#8c6a3a;--bg:#faf6ee;--line:#e5d9c3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;z-index:20;background:rgba(250,246,238,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:800;letter-spacing:.14em;color:var(--accent);text-decoration:none;display:block}
.brand small{display:block;font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink-soft);margin-top:2px}
.cnt{font-size:12.5px;color:var(--ink-soft)}
.search{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px}
.search input{border:0;outline:0;font-size:13px;width:180px;background:transparent;color:var(--ink)}
.grid{max-width:1400px;margin:18px auto 60px;padding:0 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;cursor:zoom-in;content-visibility:auto;contain-intrinsic-size:150px 190px}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#f4eee4}
.card .nm{font-size:10.5px;color:var(--ink-soft);padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid #f1e9da}
.sentinel{height:40px}
#lb{position:fixed;inset:0;z-index:100;background:rgba(24,18,12,.94);display:none;align-items:center;justify-content:center}
#lb.open{display:flex}
#lb img{max-width:92vw;max-height:86vh;object-fit:contain;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:22px;cursor:pointer}
#lb .nav:hover{background:rgba(255,255,255,.26)}
#lbPrev{left:18px}#lbNext{right:18px}
#lbClose{position:absolute;top:14px;right:18px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);border:0;color:#fff;font-size:18px;cursor:pointer}
#lbCap{position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#e9e0d2;font-size:12px}
#gate{position:fixed;inset:0;z-index:200;background:rgba(250,246,238,.98);display:none;align-items:center;justify-content:center}
.gbox{width:min(360px,88vw);border:1px solid var(--line);background:#fff;border-radius:14px;padding:26px 24px;text-align:center}
.gbox h1{font-size:15px;letter-spacing:.16em;margin:0 0 14px;color:var(--accent)}
.gbox input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;text-align:center;letter-spacing:.3em;outline:0}
.gbox input:focus{border-color:var(--accent)}
.gbox button{margin-top:12px;width:100%;padding:10px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:13.5px;letter-spacing:.1em;cursor:pointer}
.gbox .msg{font-size:12px;color:#b4453a;margin-top:8px;min-height:16px}
</style>
</head>
<body>

<div id="gate">
  <div class="gbox">
    <h1>會員專區</h1>
    <input id="pw" type="password" inputmode="numeric" placeholder="請輸入密碼" autocomplete="off">
    <button id="go" type="button">進入</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<header>
  <div class="bar">
    <a class="brand" href="../index.html">會員專區<small>三三藝 331.today ← 回首頁</small></a>
    <span class="cnt" id="cnt"></span>
    <span class="search"><input id="q" type="search" placeholder="搜尋檔名…"></span>
  </div>
</header>

<div class="grid" id="grid"></div>
<div class="sentinel" id="sentinel"></div>

<div id="lb">
  <button id="lbClose" type="button">✕</button>
  <button id="lbPrev" class="nav" type="button">‹</button>
  <img id="lbImg" alt="">
  <button id="lbNext" class="nav" type="button">›</button>
  <div id="lbCap"></div>
</div>

<script src="./files.js"></script>
<script>
(function(){
  'use strict';

  var KEY='331_member_ok', PASS='123456', TTL=12*60*60*1000;   /* 驗證後 12 小時內不再問 */
  var BASE='../images/member_clip/';
  var all=(window.MEMBER_FILES||[]), shown=[], idx=0, step=200;
  var $=function(id){return document.getElementById(id);};

  var gate=$('gate'), grid=$('grid'), cntEl=$('cnt'), qEl=$('q'), sentinel=$('sentinel');
  var lb=$('lb'), lbImg=$('lbImg'), cap=$('lbCap');
  var pos=0, pool=[];

  /* ---------- 授權狀態 ---------- */
  function isOk(){
    try{
      if(Number(localStorage.getItem(KEY)||0)>Date.now())return true;
      if(sessionStorage.getItem(KEY)==='1')return true;
    }catch(e){}
    return false;
  }
  function mark(){
    try{localStorage.setItem(KEY,String(Date.now()+TTL));}catch(e){}
    try{sessionStorage.setItem(KEY,'1');}catch(e){}
  }

  /* ---------- 清單 ---------- */
  function filter(){
    var q=qEl.value.trim().toLowerCase();
    shown = q ? all.filter(function(f){return f.toLowerCase().indexOf(q)>=0;}) : all.slice();
    idx=0; grid.innerHTML='';
    if(!shown.length){
      grid.innerHTML='<div style="grid-column:1/-1;padding:40px 0;text-align:center;color:#8c8377;font-size:13px">沒有符合的檔名</div>';
      cntEl.textContent='0 張';
      return;
    }
    render();
  }

  function card(f){
    var d=document.createElement('div'); d.className='card';
    var img=document.createElement('img');
    img.loading='lazy'; img.decoding='async'; img.alt=f;
    img.src=BASE+encodeURIComponent(f);
    img.onerror=function(){d.style.display='none';};
    d.appendChild(img);
    var n=document.createElement('div'); n.className='nm'; n.textContent=f;
    d.appendChild(n);
    d.onclick=function(){openLB(f);};
    return d;
  }

  function render(){
    var end=Math.min(idx+step, shown.length), frag=document.createDocumentFragment();
    for(;idx<end;idx++) frag.appendChild(card(shown[idx]));
    grid.appendChild(frag);
    cntEl.textContent=shown.length+' 張';
  }

  /* ---------- 進場 ---------- */
  function boot(){
    if(!all.length){
      grid.innerHTML='<div style="grid-column:1/-1;padding:40px 0;text-align:center;color:#8c8377;font-size:13px">'
        +'讀不到清單（member/files.js），或 images/member_clip 內沒有圖</div>';
      return;
    }
    shown=all.slice(); idx=0; grid.innerHTML='';
    render();
  }
  function begin(){
    gate.style.display='none';
    boot();
  }

  /* ---------- 密碼（未驗證過才顯示） ---------- */
  $('go').onclick=function(){
    if($('pw').value.trim()===PASS){ mark(); begin(); }
    else { $('msg').textContent='密碼錯誤'; $('pw').value=''; }
  };
  $('pw').addEventListener('keydown',function(e){
    if(e.key==='Enter') $('go').click();
  });

  /* ---------- 搜尋 ---------- */
  qEl.addEventListener('input',function(){
    clearTimeout(qEl._t); qEl._t=setTimeout(filter,220);
  });

  /* ---------- 捲動續載 ---------- */
  if(window.IntersectionObserver){
    new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting && idx<shown.length) render(); });
    },{rootMargin:'600px'}).observe(sentinel);
  }

  /* ---------- Lightbox ---------- */
  function openLB(f){
    pool=(shown.length?shown:all);
    var j=pool.indexOf(f); if(j<0)j=0;
    pos=j; lb.classList.add('open'); show();
  }
  function show(){
    var f=pool[pos];
    lbImg.src=BASE+encodeURIComponent(f);
    cap.textContent=f+'　'+(pos+1)+'/'+pool.length;
  }
  function move(d){ pos=(pos+d+pool.length)%pool.length; show(); }
  $('lbPrev').onclick=function(e){e.stopPropagation();move(-1);};
  $('lbNext').onclick=function(e){e.stopPropagation();move(1);};
  $('lbClose').onclick=function(){lb.classList.remove('open');};
  lb.addEventListener('click',function(e){ if(e.target===lb) lb.classList.remove('open'); });
  document.addEventListener('keydown',function(e){
    if(!lb.classList.contains('open'))return;
    if(e.key==='Escape')lb.classList.remove('open');
    if(e.key==='ArrowLeft')move(-1);
    if(e.key==='ArrowRight')move(1);
  });

  /* ---------- 啟動（所有定義完成後） ---------- */
  if(isOk()){ begin(); }
  else { gate.style.display='flex'; $('pw').focus(); }
})();
</script>
</body>
</html>
