  <script>
    const catToggle = document.getElementById('catToggle');
    const catDropdown = document.getElementById('catDropdown');
    const smBtn = document.getElementById('smBtn');
    const smPanel = document.getElementById('smPanel');

    function closeCat() { catDropdown.classList.remove('open'); catToggle.setAttribute('aria-expanded','false'); }
    function closeSm() { smPanel.classList.remove('open'); smBtn.setAttribute('aria-expanded','false'); }

    catToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = catDropdown.classList.toggle('open');
      catToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) closeSm();
    });
    smBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const open = smPanel.classList.toggle('open');
      smBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) closeCat();
    });
    document.addEventListener('click', (e) => {
      if (!catDropdown.contains(e.target) && e.target !== catToggle) closeCat();
      if (!smPanel.contains(e.target) && e.target !== smBtn) closeSm();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeCat(); closeSm(); catToggle.focus(); }
    });
  </script>
