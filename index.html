<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三三藝 | Grid 圖庫</title>
  <meta name="description" content="三三藝 — 當代藝術作品 Grid 圖庫，收錄陶藝、雕塑、茶道具、植栽與空間攝影作品。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="site-logo" aria-label="三三藝首頁">
        <span class="logo-mark">三三</span>
        <span class="logo-text">藝</span>
      </a>
      <nav class="site-nav">
        <a href="#" class="nav-link">首頁</a>
        <a href="#gallery" class="nav-link active">圖庫</a>
        <a href="#category-nav" class="nav-link">分類</a>
        <a href="#about" class="nav-link">關於</a>
        <a href="#contact" class="nav-link">聯絡</a>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero" id="about">
    <div class="hero-inner">
      <h1 class="hero-title">三三藝</h1>
      <p class="hero-subtitle">331 Gallery</p>
      <p class="hero-desc">三三藝致力於呈現當代東方美學，陶藝、雕塑、茶道具、文玩、玉石、書籍等藝術作品，每一件作品都是生活美學的延伸。</p>
    </div>
  </section>

  <!-- Gallery -->
  <main id="gallery" class="gallery-section">
    <!-- Category Navigation (dynamically generated from data.js) -->
    <nav class="category-nav" id="category-nav" aria-label="作品分類">
      <!-- 由 JS 根據 data.js 自動生成 -->
    </nav>

    <!-- Results Toolbar -->
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="result-count" id="result-count">0 件作品</span>
        <span class="page-indicator" id="page-indicator">第 1 頁</span>
      </div>
      <div class="toolbar-actions">
        <select class="sort-select" id="sort-select" aria-label="排序方式">
          <option value="default">預設排序</option>
          <option value="random">隨機排列</option>
          <option value="id-asc">編號遞增</option>
          <option value="id-desc">編號遞減</option>
        </select>
        <div class="layout-toggle" role="group" aria-label="顯示模式">
          <button class="layout-btn active" data-layout="grid" aria-label="正方形網格">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          </button>
          <button class="layout-btn" data-layout="masonry" aria-label="瀑布流">
            <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 4a1 1 0 011-1h3a1 1 0 011 1v4a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 12a1 1 0 011-1h3a1 1 0 011 1v4a1 1 0 01-1 1H4a1 1 0 01-1-1v-4zM10 3a1 1 0 00-1 1v6a1 1 0 001 1h3a1 1 0 001-1V4a1 1 0 00-1-1h-3zM10 13a1 1 0 00-1 1v3a1 1 0 001 1h3a1 1 0 001-1v-3a1 1 0 00-1-1h-3z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Grid Container -->
    <div class="grid-container" id="grid-container">
      <!-- Items injected by JS -->
    </div>

    <!-- Pagination Navigation -->
    <nav class="pagination" id="pagination" aria-label="分頁導航">
      <!-- Injected by JS -->
    </nav>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="關閉">&times;</button>
    <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="上一張">&#8249;</button>
    <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="下一張">&#8250;</button>
    <div class="lightbox-content">
      <img class="lightbox-image" id="lightbox-image" src="" alt="">
      <div class="lightbox-info">
        <span class="lightbox-title" id="lightbox-title"></span>
        <span class="lightbox-id" id="lightbox-id"></span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer" id="contact">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-logo">三三藝</span>
        <p class="footer-tagline">331 Gallery</p>
      </div>
      <div class="footer-contact">
        <div class="contact-item">
          <span class="contact-label">聯絡</span>
          <a href="tel:0968222201" class="contact-value">0968-222201</a>
        </div>
        <div class="contact-item">
          <span class="contact-label">Line</span>
          <span class="contact-value">331.today</span>
        </div>
        <div class="contact-item">
          <span class="contact-label">設計規劃開發</span>
          <span class="contact-value">張書欣</span>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 三三藝 331 Gallery. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
